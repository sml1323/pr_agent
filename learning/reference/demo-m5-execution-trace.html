<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo_m5 실행 추적</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2330; --sub:#5b6472; --line:#e3e7ee;
    --code-bg:#0f1420; --code-ink:#d5dbe8; --code-dim:#6b7a94; --hl:#2b3a5e; --hl-edge:#7aa2ff;
    --accent:#2f6fed; --ok:#1a9c6b; --bad:#d84f4f; --warn:#c98a1b;
    --lane:#e9edf4; --lane-fill:#7aa2ff; --lane-done:#39b98a; --lane-dead:#d84f4f; --lane-fail:#c98a1b;
    --chip:#eef2f9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1117; --panel:#161b24; --ink:#e6eaf2; --sub:#94a0b4; --line:#242c3a;
      --code-bg:#0a0e16; --code-ink:#cfd6e4; --code-dim:#5c6b85; --hl:#22314f; --hl-edge:#7aa2ff;
      --lane:#222a38; --chip:#1d2532;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Pretendard",Segoe UI,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
  h1{font-size:21px;margin:6px 0 2px}
  .sub{color:var(--sub);font-size:13.5px;margin-bottom:14px}
  .tabs{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);
       padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13.5px}
  .tab.on{border-color:var(--accent);color:var(--accent);font-weight:700}
  .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:14px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ptitle{font-size:12px;letter-spacing:.4px;color:var(--sub);padding:8px 12px;border-bottom:1px solid var(--line);
          display:flex;justify-content:space-between;align-items:center}
  .file{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--accent)}
  pre{margin:0;padding:10px 0;background:var(--code-bg);color:var(--code-ink);
      font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
  .ln{display:block;padding:0 14px 0 10px;white-space:pre}
  .ln.hl{background:var(--hl);border-left:3px solid var(--hl-edge);padding-left:7px}
  .ln .c{color:var(--code-dim)}
  .state{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
  .clock{font-family:ui-monospace,monospace;font-size:13px;color:var(--accent);font-weight:700}
  .procs{display:flex;gap:10px;flex-wrap:wrap}
  .proc{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px;flex:1}
  .proc b{font-size:13px}
  .proc .st{font-size:12px;color:var(--sub)}
  .proc.dead{border-color:var(--bad)} .proc.dead .st{color:var(--bad)}
  .proc.live{border-color:var(--ok)}
  .lanes{display:flex;flex-direction:column;gap:6px}
  .lane{display:grid;grid-template-columns:64px 1fr 84px;gap:8px;align-items:center;font-size:12px}
  .lane .nm{font-family:ui-monospace,monospace}
  .bar{height:12px;background:var(--lane);border-radius:6px;overflow:hidden;position:relative}
  .fill{height:100%;border-radius:6px;background:var(--lane-fill);transition:width .25s}
  .fill.done{background:var(--lane-done)} .fill.dead{background:var(--lane-dead)}
  .fill.fail{background:var(--lane-fail)}
  .lane .tag{color:var(--sub);text-align:right;font-family:ui-monospace,monospace;font-size:11px}
  table.vars{width:100%;border-collapse:collapse;font-size:12.5px}
  table.vars td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  table.vars td:first-child{font-family:ui-monospace,monospace;color:var(--accent);white-space:nowrap;width:38%}
  table.vars td:last-child{font-family:ui-monospace,monospace;word-break:break-all}
  .boxlabel{font-size:11px;color:var(--sub);letter-spacing:.4px;margin-bottom:4px}
  .sq{font:12px/1.6 ui-monospace,monospace;background:var(--chip);border-radius:8px;padding:8px 10px;
      overflow-x:auto;white-space:pre}
  .explain{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
           font-size:14.5px}
  .explain b{color:var(--accent)}
  .explain .warn{color:var(--warn);font-weight:700}
  .explain .ok{color:var(--ok);font-weight:700}
  .explain .bad{color:var(--bad);font-weight:700}
  .nav{display:flex;gap:10px;align-items:center;margin-top:12px}
  button.nv{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
            padding:9px 18px;font-size:14px;cursor:pointer}
  button.nv:disabled{opacity:.35;cursor:default}
  button.nv.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .prog{flex:1;height:6px;background:var(--lane);border-radius:3px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .stepno{font-size:12px;color:var(--sub);font-family:ui-monospace,monospace;white-space:nowrap}
  kbd{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>demo_m5.py 실행 추적 — 한 스텝씩</h1>
  <div class="sub">M5 완료 판정 ①②③이 코드의 어느 줄에서, 변수가 어떻게 변하면서 통과하는지.
    <kbd>←</kbd> <kbd>→</kbd> 로 이동 · 실측 2026-08-21 · langgraph 1.2.11</div>

  <div class="tabs" id="tabs"></div>

  <div class="grid">
    <div class="panel">
      <div class="ptitle"><span>코드</span><span class="file" id="fname"></span></div>
      <pre id="code"></pre>
    </div>
    <div class="panel">
      <div class="ptitle"><span>이 시점의 상태</span><span class="clock" id="clock"></span></div>
      <div class="state" id="state"></div>
    </div>
  </div>

  <div class="explain" id="explain"></div>

  <div class="nav">
    <button class="nv" id="prev">← 이전</button>
    <div class="prog"><i id="bar"></i></div>
    <span class="stepno" id="stepno"></span>
    <button class="nv primary" id="next">다음 →</button>
  </div>
</div>

<script>
// ───────────────────────── 코드 발췌 (파일별) ─────────────────────────
const CODE = {
demo_par: {file:"scripts/demo_m5.py — scenario_parallel()", lines:[
"def scenario_parallel() -> bool:",
"    _reset_db()                        # sqlite 파일 삭제 — 백지에서",
"    with _saver() as saver:            # SqliteSaver (컨텍스트 매니저)",
"        engine = _engine(saver)        # 그래프 조립 + compile",
"        t0 = time.perf_counter()",
"        engine.run(KEY_PARALLEL, _diff())",
"        elapsed = time.perf_counter() - t0",
"        s = engine.get_state(KEY_PARALLEL)",
"",
"    serial_total = sum(_DELAYS.values())   # 직렬이면 2.1초",
"    slowest = max(_DELAYS.values())        # 최장 노드 0.8초",
"    parallel_ok = elapsed < slowest + 0.3  # ← 판정식 (B)",
"    return parallel_ok and s[\"status\"] == \"done\" \\",
"        and len(s[\"findings\"]) == 4",
]},
build: {file:"backend/orchestration/langgraph_engine.py — _build()", lines:[
"graph = StateGraph(ReviewState)",
"graph.add_node(\"security\", security_node)   # + quality/testing/docs",
"graph.add_node(\"aggregate\", _aggregate)",
"# 팬아웃 — START 에서 넷으로",
"graph.add_edge(START, \"security\")           # ×4",
"# 팬인 — 넷에서 aggregate 로",
"graph.add_edge(\"security\", \"aggregate\")     # ×4",
"graph.add_edge(\"aggregate\", END)",
"compiled = graph.compile(checkpointer=self._checkpointer)",
]},
node: {file:"langgraph_engine.py — _call_agent() / _run_specialist()", lines:[
"def _call_agent(agent_type):",
"    hangs = agent_type in _hanging_agents()   # M5_HANG_AGENTS",
"    started = time.monotonic()",
"    while True:",
"        elapsed = time.monotonic() - started",
"        if not hangs and elapsed >= _DELAYS[agent_type]:",
"            break                     # 일이 끝났다",
"        if elapsed >= AGENT_TIMEOUT_SECONDS:   # 1.0초",
"            raise openai.APITimeoutError(request=…)",
"        time.sleep(_TICK)             # 0.02초씩 자며 마감 확인",
"    return _dummy_finding(agent_type)",
"",
"def _run_specialist(agent_type, state):",
"    try:",
"        finding = _call_agent(agent_type)",
"    except openai.OpenAIError as e:   # 바깥 탓",
"        log.warning(e)                # 한 줄만",
"        return {\"failed_agents\": [agent_type]}",
"    except Exception as e:            # 내 탓 의심",
"        log.exception(e)              # 스택트레이스",
"        return {\"failed_agents\": [agent_type]}",
"    return {\"findings\": [finding.model_dump()]}  # 쪽지",
]},
gstate: {file:"langgraph_engine.py — get_state()", lines:[
"def get_state(self, review_key):",
"    snapshot = self._graph.get_state(self._config(review_key))",
"    defaults = {\"review_key\": review_key, \"diff\": \"\",",
"                \"findings\": [], \"failed_agents\": []}",
"    return {",
"        **defaults,           # 기본값 먼저 깔고",
"        **snapshot.values,    # 스냅샷이 있으면 덮는다",
"        \"next_nodes\": list(snapshot.next),",
"        \"status\": (\"not_started\" if snapshot.created_at is None",
"                   else \"running\" if snapshot.next",
"                   else \"done\"),",
"    }",
]},
demo_kill: {file:"scripts/demo_m5.py — scenario_kill9()", lines:[
"def scenario_kill9() -> bool:",
"    _reset_db()",
"    worker = subprocess.Popen(",
"        [sys.executable, __file__, \"--child\", KEY_KILL9], …)",
"    worker.stdout.readline()    # \"READY\" 를 기다린다 (함정 ④)",
"    time.sleep(0.5)             # 그래프 0.5초 지점",
"    alive = worker.poll() is None   # 살아있는지 먼저 (함정 ②)",
"    worker.kill()               # SIGKILL — 가로채기 불가",
"    rc = worker.wait()",
"    with _saver() as saver:",
"        engine = _engine(saver)",
"        before = engine.get_state(KEY_KILL9)",
"        engine.resume(KEY_KILL9)    # invoke(None) — 이어서",
"        after = engine.get_state(KEY_KILL9)",
"    return alive and rc == -9 \\",
"        and after[\"status\"] == \"done\" and len(after[\"findings\"]) == 4",
]},
child: {file:"scripts/demo_m5.py — child()  (자식 프로세스)", lines:[
"def child(review_key):",
"    with _saver() as saver:",
"        engine = _engine(saver)     # import+조립 ≈ 0.5초",
"        print(\"READY\", flush=True)  # 여기부터가 그래프 시간",
"        engine.run(review_key, _diff())",
"        print(\"DONE\", flush=True)   # kill 되면 안 나온다",
]},
demo_hang: {file:"scripts/demo_m5.py — scenario_hang()", lines:[
"def scenario_hang() -> bool:",
"    _reset_db()",
"    os.environ[\"M5_HANG_AGENTS\"] = \"security\"",
"    try:",
"        with _saver() as saver:",
"            engine = _engine(saver)",
"            engine.run(KEY_HANG, _diff())   # security 는 영영 안 온다",
"            s = engine.get_state(KEY_HANG)",
"    finally:",
"        os.environ.pop(\"M5_HANG_AGENTS\", None)  # 다음에 새면 안 됨",
"    return s[\"status\"] == \"done\" \\",
"        and s[\"failed_agents\"] == [\"security\"] \\",
"        and len(s[\"findings\"]) == 3",
]},
};

// ───────────────────────── 상태 렌더 도우미 ─────────────────────────
// lane: [이름, 진행률0~1, 상태(run|done|dead|fail|wait), 라벨]
function lanes(arr){
  return `<div><div class="boxlabel">스페셜리스트 4개 (지연: security 0.6 · quality 0.4 · testing 0.8 · docs 0.3)</div>
  <div class="lanes">`+arr.map(([n,p,st,tag])=>{
    const cls = st==="done"?"done":st==="dead"?"dead":st==="fail"?"fail":"";
    return `<div class="lane"><span class="nm">${n}</span>
      <div class="bar"><div class="fill ${cls}" style="width:${Math.round(p*100)}%"></div></div>
      <span class="tag">${tag}</span></div>`;
  }).join("")+`</div></div>`;
}
function vars(rows){
  return `<div><div class="boxlabel">변수 / 반환값</div><table class="vars">`+
    rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join("")+`</table></div>`;
}
function procs(arr){
  return `<div><div class="boxlabel">프로세스</div><div class="procs">`+
    arr.map(([nm,st,cls])=>`<div class="proc ${cls||""}"><b>${nm}</b><div class="st">${st}</div></div>`).join("")
    +`</div></div>`;
}
function sq(text){
  return `<div><div class="boxlabel">checkpoints.sqlite (체크포인터가 보는 것)</div><div class="sq">${text}</div></div>`;
}

// ───────────────────────── 스텝 데이터 ─────────────────────────
const CH = [
{name:"① 병렬", steps:[

{code:"demo_par",hl:[1],clock:"—",
 explain:"<b>백지에서 시작.</b> 이전 실행의 체크포인트가 남아 있으면 run() 이 새 리뷰가 아니라 끝난 리뷰 위에 이어 붙는다 — 그래서 시나리오마다 sqlite 파일을 지운다.",
 state: procs([["부모 (데모)","실행 중","live"]]) + sq("(파일 없음)")},

{code:"demo_par",hl:[2,3],clock:"—",
 explain:"<b>saver 를 열고 엔진을 만든다.</b> <code>from_conn_string</code> 은 컨텍스트 매니저라 <code>with</code> 를 벗어나면 커넥션이 닫힌다 (checkpointer.py 함정 ①). 엔진 생성 = 그래프 <b>조립</b> — 아직 아무것도 실행되지 않는다.",
 state: procs([["부모 (데모)","engine 조립 중","live"]]) + sq("(빈 파일 생성됨)")},

{code:"build",hl:[4,6],clock:"—",
 explain:"<b>설계도.</b> 팬아웃(START→4개)과 팬인(4개→aggregate)이 전부 평범한 add_edge 다. 엣지는 <b>\"어느 층에 서나\"</b>만 정한다 — superstep(층)은 설계도에 없고, invoke 할 때 실행이 긋는다 (Lesson 08).",
 state: procs([["부모 (데모)","compile() 완료","live"]]) +
   vars([["그래프","START → [security|quality|testing|docs] → aggregate → END"]])},

{code:"demo_par",hl:[5],clock:"0.00초",
 explain:"<b>run() 호출.</b> initial dict(4채널: review_key·diff·findings=[]·failed_agents=[])을 넣고 invoke. LangGraph 가 제일 먼저 하는 일은 <b>입력 체크포인트 기록</b> — 이게 있어야 죽어도 \"시작은 했다\"가 남는다.",
 state: procs([["부모 (데모)","invoke 진입","live"]]) +
   vars([["initial","{review_key, diff, findings: [], failed_agents: []}"]]) +
   sq("checkpoint #1 (입력)\n  channel_values: 4채널 전부\n  next: security, quality, testing, docs")},

{code:"node",hl:[1,2],clock:"0.00초",
 explain:"<b>superstep 1 시작 — 넷이 동시에.</b> START 에서 나가는 엣지 4개가 같은 층이라, 스레드풀에서 4개 노드가 <b>병렬로</b> 뜬다. 각자 _call_agent 에 들어가 시계를 잰다. hangs=False (환경변수 비어 있음).",
 state: lanes([["security",0,"run","0.0/0.6s"],["quality",0,"run","0.0/0.4s"],["testing",0,"run","0.0/0.8s"],["docs",0,"run","0.0/0.3s"]]) +
   vars([["hangs","False (넷 다)"],["started","time.monotonic()"]])},

{code:"node",hl:[3,4,5,9],clock:"0.15초",
 explain:"<b>루프가 도는 이유.</b> <code>time.sleep(0.6)</code> 한 방이 아니라 0.02초씩 자면서 매번 두 조건을 확인한다: \"일이 끝났나\"(_DELAYS 도달)와 \"마감이 지났나\"(1.0초). 한 번에 다 자면 <span class='warn'>마감을 확인할 틈이 없다</span> — 타임아웃이 이 함수 <b>안</b>에서 터져야 try 가 잡는다 (Lesson 10).",
 state: lanes([["security",0.25,"run","0.15/0.6s"],["quality",0.37,"run","0.15/0.4s"],["testing",0.19,"run","0.15/0.8s"],["docs",0.5,"run","0.15/0.3s"]])},

{code:"node",hl:[5,6,10,21],clock:"0.30초",
 explain:"<b>docs 가 첫 번째로 끝난다.</b> break → Finding 생성(여기서 Pydantic 이 INV-3 검증) → <code>model_dump()</code> 로 dict 로 눕혀서 <b>쪽지</b> {\"findings\": [dict]} 를 반환. 노드는 state 를 직접 안 고친다 — 쪽지는 <b>pending_writes</b> 로 저장되고, 채널에는 아직 커밋 안 됐다.",
 state: lanes([["security",0.5,"run","0.30/0.6s"],["quality",0.75,"run","0.30/0.4s"],["testing",0.38,"run","0.30/0.8s"],["docs",1,"done","완료 ✓"]]) +
   sq("checkpoint #1 (입력)\npending_writes:\n  docs → {findings: [1개]}")},

{code:"node",hl:[21],clock:"0.60초",
 explain:"<b>quality(0.4초)·security(0.6초)도 끝.</b> 쪽지가 셋 쌓였다. <span class='warn'>배리어</span>: testing(0.8초)이 안 끝나서 층이 아직 안 닫힌다 — 먼저 끝난 셋은 그냥 기다린다. \"엣지로 안 이어진 느린 노드까지 기다린다\"가 Lesson 08 실측.",
 state: lanes([["security",1,"done","완료 ✓"],["quality",1,"done","완료 ✓"],["testing",0.75,"run","0.60/0.8s"],["docs",1,"done","완료 ✓"]]) +
   sq("pending_writes:\n  docs, quality, security → 쪽지 3개")},

{code:"demo_par",hl:[5],clock:"0.80초",
 explain:"<b>층이 닫힌다.</b> testing 이 끝나는 순간 배리어 해제 → <b>리듀서</b>(operator.add)가 쪽지 4개를 채널에 합친다: findings 0+1+1+1+1=4. 이제야 채널에 커밋되고 checkpoint #2 가 기록된다. <b>가장 느린 노드(0.8초)가 층 전체의 시간을 정했다.</b>",
 state: lanes([["security",1,"done","완료 ✓"],["quality",1,"done","완료 ✓"],["testing",1,"done","완료 ✓"],["docs",1,"done","완료 ✓"]]) +
   vars([["findings 채널","[] + 쪽지4 → dict 4개"],["failed_agents","[]"]]) +
   sq("checkpoint #2\n  findings: 4 · failed: []\n  next: aggregate")},

{code:"demo_par",hl:[5,6],clock:"0.83초",
 explain:"<b>superstep 2: aggregate.</b> M6 의 자리라 지금은 {} 반환 — 아무것도 안 바꾼다. END 도달, invoke 반환. elapsed = <b>0.83초</b> (그래프 0.8 + 오버헤드 0.03).",
 state: vars([["elapsed","0.83"],["체크포인트","#3 (aggregate 뒤) · next: 없음"]])},

{code:"gstate",hl:[1,4,5,6],clock:"0.83초",

// ───────────────────────── 렌더링 ─────────────────────────
let ch = 0, idx = 0;
const $ = id => document.getElementById(id);

function renderTabs(){
  $("tabs").innerHTML = CH.map((c,i)=>
    `<button class="tab ${i===ch?'on':''}" onclick="go(${i},0)">${c.name}</button>`).join("");
}
function render(){
  renderTabs();
  const st = CH[ch].steps[idx];
  const cv = CODE[st.code];
  $("fname").textContent = cv.file;
  $("code").innerHTML = cv.lines.map((l,i)=>{
    const esc = l.replace(/&/g,"&amp;").replace(/</g,"&lt;");
    const withC = esc.replace(/(#.*)$/, '<span class="c">$1</span>');
    return `<span class="ln ${st.hl.includes(i)?'hl':''}">${withC||" "}</span>`;
  }).join("");
  $("clock").textContent = st.clock;
  $("state").innerHTML = st.state;
  $("explain").innerHTML = st.explain;
  $("stepno").textContent = `${idx+1} / ${CH[ch].steps.length}`;
  $("bar").style.width = ((idx+1)/CH[ch].steps.length*100)+"%";
  $("prev").disabled = (idx===0 && ch===0);
  $("next").textContent = (idx===CH[ch].steps.length-1)
    ? (ch<CH.length-1 ? "다음 시나리오 →" : "처음으로 ↺") : "다음 →";
}
function go(c,i){ ch=c; idx=i; render(); }
function next(){
  if(idx < CH[ch].steps.length-1) idx++;
  else if(ch < CH.length-1){ ch++; idx=0; }
  else { ch=0; idx=0; }
  render();
}
function prev(){
  if(idx>0) idx--;
  else if(ch>0){ ch--; idx=CH[ch].steps.length-1; }
  render();
}
$("next").onclick = next; $("prev").onclick = prev;
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
});
render();
</script>
