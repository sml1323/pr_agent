# 로컬 개발용 Postgres — TimescaleDB + pgvector
#
#   docker compose up -d       띄우기
#   docker compose down        멈추기 (데이터는 남는다)
#   docker compose down -v     데이터까지 지우기 ← M2 에서 갈아엎을 때
#
# 왜 로컬인가: docs/adr/0003-local-postgres-instead-of-tiger.md
#
# HA 이미지를 쓰는 이유 — TimescaleDB Toolkit 과 부가 확장이 같이 들어 있어서
# 확장을 따로 빌드할 필요가 없다. light 이미지(Alpine)는 Toolkit 이 빠져 있다.
# 출처: https://www.tigerdata.com/docs/get-started/choose-your-path/install-timescaledb

services:
  db:
    image: timescale/timescaledb-ha:pg17
    container_name: pr_agent_db
    ports:
      # 127.0.0.1 에만 묶는다 — 외부에서 접근 불가.
      # 개발용 DB 를 공용 인터페이스에 노출하지 않는 것이 기본값이어야 한다.
      #
      # 5434 인 이유: 이 머신에 다른 Postgres 가 여럿 떠 있어 기본 5432/5433 과 충돌한다.
      # 왼쪽이 내 컴퓨터 포트, 오른쪽이 컨테이너 안쪽 포트다. 안쪽은 5432 그대로 둔다 —
      # 바꾸면 Postgres 설정까지 손대야 하고 얻는 게 없다.
      # ⚠️ 여기를 바꾸면 .env 의 DATABASE_URL 도 같이 바꿔야 한다.
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: pr_agent
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      # "컨테이너가 떴다"와 "Postgres 가 질의를 받는다"는 다르다.
      # 이게 없으면 migrate.py 가 아직 안 뜬 DB 에 붙어서 애매하게 실패한다.
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_agent"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
